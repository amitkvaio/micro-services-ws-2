# Kubernetes live demo reference for exchange-service
# This file is written in .properties format for easy reading.
# kubectl cannot apply .properties files directly. Use ../manifests for real deployment.

deployment.apiVersion=apps/v1
deployment.kind=Deployment
deployment.metadata.name=exchange-service
deployment.metadata.namespace=microservices-live-demo
deployment.spec.replicas=1
deployment.spec.selector.matchLabels.app=exchange-service
deployment.spec.template.metadata.labels.app=exchange-service
deployment.spec.template.spec.containers[0].name=exchange-service
deployment.spec.template.spec.containers[0].image=kubernetes-basics:local
deployment.spec.template.spec.containers[0].imagePullPolicy=IfNotPresent
deployment.spec.template.spec.containers[0].ports[0].containerPort=8205
deployment.spec.template.spec.containers[0].env[0].name=DEMO_SERVICE_NAME
deployment.spec.template.spec.containers[0].env[0].value=exchange-service

service.apiVersion=v1
service.kind=Service
service.metadata.name=exchange-service
service.metadata.namespace=microservices-live-demo
service.spec.selector.app=exchange-service
service.spec.ports[0].port=8000
service.spec.ports[0].targetPort=8205
