apiVersion: apps/v1
kind: Deployment
metadata:
  name: naming-server
  namespace: microservices-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: naming-server
  template:
    metadata:
      labels:
        app: naming-server
    spec:
      containers:
        - name: naming-server
          image: naming-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: naming-server
  namespace: microservices-demo
spec:
  selector:
    app: naming-server
  ports:
    - port: 8761
      targetPort: 8761
